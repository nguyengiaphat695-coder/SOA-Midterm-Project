server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /api/v1/users/me/transactions { proxy_pass http://payment-service:3003; }
    location /api/v1/auth/ { proxy_pass http://user-service:3001; }
    location /api/v1/users/ { proxy_pass http://user-service:3001; }
    location /api/v1/tuitions/ { proxy_pass http://tuition-service:3002; }
    location /api/v1/payments { proxy_pass http://payment-service:3003; }
    location / { try_files $uri $uri/ /index.html; }
    # No /internal/* routes; service ports are not publicly published.
}
