name: ibanking-tuition-v3
services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_postgres_only}
    volumes:
      - ./database/init/01-init-database.sh:/docker-entrypoint-initdb.d/01-init-database.sh:ro
      - ./database/init:/schema:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d payment_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAIL_UI_PORT:-8025}:8025"]
    networks: [backend]

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local_demo_postgres_only}@postgres-db:5432/user_db
      JWT_SECRET: ${JWT_SECRET:-local_demo_change_this_long_jwt_secret_2026}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local_demo_internal_service_secret_2026}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres-db: {condition: service_healthy}
    networks: [backend]

  tuition-service:
    build: ./services/tuition-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local_demo_postgres_only}@postgres-db:5432/tuition_db
      JWT_SECRET: ${JWT_SECRET:-local_demo_change_this_long_jwt_secret_2026}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local_demo_internal_service_secret_2026}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres-db: {condition: service_healthy}
    networks: [backend]

  payment-service:
    build: ./services/payment-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local_demo_postgres_only}@postgres-db:5432/payment_db
      JWT_SECRET: ${JWT_SECRET:-local_demo_change_this_long_jwt_secret_2026}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local_demo_internal_service_secret_2026}
      OTP_SECRET: ${OTP_SECRET:-local_demo_otp_secret_change_in_production_2026}
      USER_SERVICE_URL: http://user-service:3001
      TUITION_SERVICE_URL: http://tuition-service:3002
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-ibanking@demo.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres-db: {condition: service_healthy}
      mailpit: {condition: service_started}
      user-service: {condition: service_healthy}
      tuition-service: {condition: service_healthy}
    networks: [backend]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      user-service: {condition: service_healthy}
      tuition-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
    networks: [backend]

  test-runner:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local_demo_postgres_only}@postgres-db:5432/postgres
    depends_on:
      postgres-db: {condition: service_healthy}
    networks: [backend]

volumes:
  pgdata:
networks:
  backend:
    driver: bridge
